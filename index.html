<!DOCTYPE html>
<html lang="en" class="dark h-full antialiased" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#08080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PITBULL FIT" />
    <title>PITBULL FIT — Strength Training & Workout Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M41.46 8.5 L58.54 8.5 Q61.74 8.5 62.85 11.5 L90.48 85.5 Q91.6 88.5 88.4 88.5 L68.42 88.5 Q65.22 88.5 64.17 85.48 L51.05 47.65 Q50 44.63 48.95 47.65 L35.83 85.48 Q34.78 88.5 31.58 88.5 L11.6 88.5 Q8.4 88.5 9.52 85.5 L37.15 11.5 Q38.26 8.5 41.46 8.5 Z' fill='%23ff1744'/%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pitbull_settings');
          if (saved) {
            var s = JSON.parse(saved);
            if (s.theme === 'light') {
              var el = document.documentElement;
              el.classList.remove('dark');
              el.classList.add('light');
              el.setAttribute('data-theme', 'light');
              el.style.colorScheme = 'light';
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-bg text-text select-none overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
